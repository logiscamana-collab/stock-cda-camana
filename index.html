<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock CDA Camana</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#10243e}
.header{background:#174a78;color:white;padding:24px max(24px,calc((100% - 1110px)/2))}
.header h1{margin:0;font-size:36px}.header p{margin:7px 0 0;font-size:16px}
.card{max-width:1160px;margin:28px auto;background:white;border:1px solid #dbe3ec;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,50,80,.06)}
.top{padding:22px}.title{display:flex;justify-content:space-between;gap:20px;align-items:center}.title h2{margin:0;font-size:24px}
.meta{margin-top:6px;color:#54708c;font-size:13px}.ok{color:#287d50;font-size:13px}.ok:before{content:'●';margin-right:7px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#3e5870}
.field select,.search input{width:100%;height:42px;border:1px solid #cbd7e3;border-radius:9px;padding:0 12px;font-size:14px;background:white}
.search{display:flex;gap:10px;margin-top:12px}.search input{flex:1}.btn{border:0;border-radius:9px;background:#174a78;color:white;padding:0 18px;font-weight:700;cursor:pointer}
.section{border-top:1px solid #dbe3ec}.section-title{padding:16px 22px 10px;font-size:14px;font-weight:700;color:#345b7e;text-transform:uppercase}
.table-wrap{overflow:auto}.count{padding:0 22px 12px;color:#54708c;font-size:13px}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 16px;border-top:1px solid #dbe3ec;text-align:left;font-size:14px}
th{background:#f7f9fb;color:#345b7e;font-size:12px;letter-spacing:.04em}.stock-cell{text-align:right;white-space:nowrap;font-weight:600}
.semaforo{display:inline-block;width:13px;height:13px;border-radius:50%;margin-left:9px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.verde{background:#22a447}.amarillo{background:#f2c300}.anaranjado{background:#f28c28}.rojo{background:#df3030}
.empty{text-align:center;padding:30px;color:#687d92}.footer{padding:14px 22px;color:#71869a;font-size:12px;border-top:1px solid #dbe3ec}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px;font-size:12px;color:#54708c}.legend-item{display:flex;align-items:center;gap:6px}.legend .semaforo{margin:0;width:11px;height:11px}
@media(max-width:700px){.header h1{font-size:28px}.filters{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="header"><h1>Stock CDA Camana</h1><p>Tabla dinámica · Stock Ventas</p></header>
<main class="card"><section class="top">
<div class="title"><div><h2>Stock Ventas</h2><div id="meta" class="meta">Cargando...</div></div><div class="ok">Datos actualizados</div></div>
<div class="filters">
<div class="field"><label for="familia">Familia</label><select id="familia"></select></div>
<div class="field"><label for="semaforo">Semáforo de Stock PT</label><select id="semaforo">
<option value="">Todos</option><option value="verde">🟢 Verde — mayor a 50</option>
<option value="amarillo">🟡 Amarillo — mayor a 15 y hasta 50</option>
<option value="anaranjado">🟠 Anaranjado — mayor a 5 y hasta 15</option>
<option value="rojo">🔴 Rojo — hasta 5</option></select></div></div>
<div class="search"><input id="q" placeholder="Buscar por BASIS, SAP o descripción..."><button class="btn" id="refresh">↻ Actualizar</button></div>
<div class="legend">
<div class="legend-item"><span class="semaforo verde"></span>&gt; 50</div>
<div class="legend-item"><span class="semaforo amarillo"></span>&gt; 15 y ≤ 50</div>
<div class="legend-item"><span class="semaforo anaranjado"></span>&gt; 5 y ≤ 15</div>
<div class="legend-item"><span class="semaforo rojo"></span>≤ 5</div></div>
</section>
<section class="section"><div class="section-title">Tabla dinámica</div><div id="count" class="count"></div><div class="table-wrap"><table>
<thead><tr><th>BASIS</th><th>SAP</th><th>DESCRIPCIÓN</th><th>STOCK PT</th></tr></thead><tbody id="body"></tbody></table></div></section>
<div class="footer">Se muestran únicamente productos con Status "En Circulación". La semaforización se calcula según Stock PT.</div>
</main>
<script>
let data={rows:[],options:{},filters:{}};
let firstLoad=true;
const $=id=>document.getElementById(id);
function fillFamilia(values,current){const el=$('familia');el.innerHTML='';const all=document.createElement('option');all.value='';all.textContent='Todos';el.appendChild(all);(values||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)});el.value=(values||[]).includes(current)?current:'';}
function fmt(v){return v===null||v===undefined||v===''?'':Number.isFinite(Number(v))?Number(v).toLocaleString('es-PE',{maximumFractionDigits:2}):v}
function stockNumber(v){const n=Number(v);return Number.isFinite(n)?n:null}
function stockClass(v){const n=stockNumber(v);if(n===null)return '';if(n>50)return 'verde';if(n>15)return 'amarillo';if(n>5)return 'anaranjado';return 'rojo'}
function stockLabel(v){const c=stockClass(v);return c==='verde'?'Verde':c==='amarillo'?'Amarillo':c==='anaranjado'?'Anaranjado':c==='rojo'?'Rojo':''}
function render(){
const f=$('familia').value,sem=$('semaforo').value,q=$('q').value.trim().toLowerCase();
const rows=data.rows.filter(r=>{const s=String(r.Status??'').trim().toLowerCase();const circulation=s==='en circulación'||s==='en circulacion';const stock=stockClass(r['STOCK PT']);return circulation&&(!f||r.Familia===f)&&(!sem||stock===sem)&&(!q||[r.BASIS,r.SAP,r['DESCRIPCIÓN']].join(' ').toLowerCase().includes(q));});
rows.sort((a,b)=>{
  const na=stockNumber(a['STOCK PT']), nb=stockNumber(b['STOCK PT']);
  if(na===null&&nb===null)return 0;
  if(na===null)return 1;
  if(nb===null)return -1;
  return nb-na;
});
$('count').textContent=rows.length+' productos';
$('body').innerHTML=rows.length?rows.map(r=>{const c=stockClass(r['STOCK PT']);return `<tr><td>${r.BASIS??''}</td><td>${r.SAP??''}</td><td>${r['DESCRIPCIÓN']??''}</td><td class="stock-cell">${fmt(r['STOCK PT'])}${c?` <span class="semaforo ${c}" title="${stockLabel(r['STOCK PT'])}"></span>`:''}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">No hay productos con los filtros seleccionados.</td></tr>';}
async function load(){
try{const familiaActual=$('familia').value,semaforoActual=$('semaforo').value,busquedaActual=$('q').value;
const res=await fetch('data.json?nocache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!res.ok)throw new Error('HTTP '+res.status);
data=await res.json();
fillFamilia(data.options?.Familia||[], firstLoad ? '' : familiaActual);
$('semaforo').value=firstLoad ? '' : semaforoActual;
$('q').value=busquedaActual;
firstLoad=false;
const total=data.rows.filter(r=>{const s=String(r.Status??'').trim().toLowerCase();return s==='en circulación'||s==='en circulacion';}).length;
$('meta').textContent=total+' productos en circulación · Actualizado: '+new Date(data.updated).toLocaleString('es-PE');render();
}catch(e){$('meta').textContent='No se pudo cargar data.json';$('body').innerHTML='<tr><td colspan="4" class="empty">Error al cargar los datos.</td></tr>';console.error(e)}}
$('familia').addEventListener('change',render);$('semaforo').addEventListener('change',render);$('q').addEventListener('input',render);$('refresh').addEventListener('click',load);load();setInterval(load,15000);
</script></body></html>
