
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Stock CDA Camana</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    main {
      max-width: 560px;
      margin: 25px auto;
      background: white;
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { line-height: 1.5; }
    label { display: block; margin: 17px 0 7px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #b91c1c;
      color: white;
      margin-top: 16px;
    }
    button.secondary { background: #334155; }
    .wide { width: 100%; }
    .muted { color: #64748b; font-size: 14px; }
    #editor { display: none; }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .check { display: flex; gap: 10px; align-items: center; }
    .check input { width: auto; }
    a { color: #b91c1c; }
  </style>
</head>
<body>
<main>
  <h1>Stock CDA Camana</h1>
  <p class="muted">Panel de administración del mensaje de bienvenida</p>

  <section id="login">
    <h2>Iniciar sesión</h2>
    <label for="password">Contraseña de administrador</label>
    <input id="password" type="password" autocomplete="current-password"
      placeholder="Ingresa tu contraseña">
    <button class="wide" id="loginBtn">Ingresar</button>
  </section>

  <section id="editor">
    <h2>Editar mensaje</h2>

    <label class="check">
      <input id="activo" type="checkbox">
      Mostrar mensaje de bienvenida
    </label>

    <label for="titulo">Título</label>
    <input id="titulo" maxlength="120">

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" maxlength="3000"></textarea>

    <label for="boton">Texto del botón</label>
    <input id="boton" maxlength="80">

    <button class="wide" id="saveBtn">Guardar cambios</button>
    <button class="secondary wide" id="logoutBtn">Cerrar sesión</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <p><a href="./">Volver al inventario</a></p>
</main>

<script>
(() => {
  const API = "https://stock-cda-camana-admin.logiscamana.workers.dev";
  const $ = id => document.getElementById(id);

  let password = "";
  let currentMessage = null;

  function status(message) {
    $("status").textContent = message;
  }

  async function request(path, options = {}) {
    const response = await fetch(API + path, {
      ...options,
      headers: {
        ...(options.headers || {}),
        ...(password ? { Authorization: "Bearer " + password } : {})
      },
      cache: "no-store"
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || "Error al comunicarse con el servicio.");
    }
    return data;
  }

  function showMessage(data) {
    $("activo").checked = data.activo === true;
    $("titulo").value = data.titulo || "";
    $("mensaje").value = data.mensaje || "";
    $("boton").value = data.boton || "";
  }

  function formMessage() {
    return {
      activo: $("activo").checked,
      titulo: $("titulo").value.trim(),
      mensaje: $("mensaje").value.trim(),
      boton: $("boton").value.trim()
    };
  }

  $("loginBtn").addEventListener("click", async () => {
    password = $("password").value;
    if (!password) {
      status("Ingresa tu contraseña.");
      return;
    }

    $("loginBtn").disabled = true;
    status("Verificando acceso...");

    try {
      currentMessage = await request("/api/mensaje");

      // La API actual verifica la contraseña en POST.
      // Guardamos el mismo mensaje para comprobar el acceso.
      await request("/api/mensaje", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentMessage)
      });

      showMessage(currentMessage);
      $("login").style.display = "none";
      $("editor").style.display = "block";
      $("password").value = "";
      status("Sesión iniciada correctamente.");
    } catch (error) {
      password = "";
      status("No se pudo iniciar sesión. Verifica la contraseña y vuelve a intentarlo.");
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("saveBtn").addEventListener("click", async () => {
    const message = formMessage();
    if (!message.titulo || !message.mensaje || !message.boton) {
      status("Completa el título, el mensaje y el texto del botón.");
      return;
    }

    $("saveBtn").disabled = true;
    status("Guardando cambios...");

    try {
      await request("/api/mensaje", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(message)
      });
      currentMessage = message;
      status("¡Mensaje guardado correctamente!");
    } catch (error) {
      status("No se pudo guardar: " + error.message);
    } finally {
      $("saveBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", () => {
    password = "";
    currentMessage = null;
    $("editor").style.display = "none";
    $("login").style.display = "block";
    $("password").value = "";
    status("Sesión cerrada.");
  });

  $("password").addEventListener("keydown", event => {
    if (event.key === "Enter") $("loginBtn").click();
  });
})();
</script>
</body>
</html>
